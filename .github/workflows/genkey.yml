name: GenKey
on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storetype PKCS12 \
            -alias discordrecorder \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass discordrecorder -keypass discordrecorder \
            -dname "CN=DiscordRecorder, OU=Personal, O=Personal, L=Tokyo, ST=Tokyo, C=JP"
          base64 -w0 release.keystore > release.keystore.b64
          ls -l release.keystore release.keystore.b64
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: release.keystore.b64
          retention-days: 1
